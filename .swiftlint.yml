included:
  - App
  - CLI
  - Sources
  - Tests
  - Package.swift

excluded:
  - .build
  - build
  - DerivedData

disabled_rules:
  # отдано swift-format
  - trailing_comma
  - line_length
  - opening_brace
  - statement_position
  - colon
  - comma
  - function_name_whitespace
  - return_arrow_whitespace
  - closure_parameter_position
  - vertical_whitespace
  - trailing_whitespace
  - trailing_newline
  # шум на SwiftUI/AppKit
  - todo
  - type_body_length
  - function_body_length
  - file_length
  - nesting
  - multiple_closures_with_trailing_closure

opt_in_rules:
  - array_init
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - discarded_notification_center_observer
  - empty_collection_literal
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - no_empty_block
  - overridden_super_call
  - prefer_key_path
  - private_swiftui_state
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unhandled_throwing_task
  - unowned_variable_capture
  - untyped_error_in_catch
  - weak_delegate
  - yoda_condition

identifier_name:
  min_length:
    warning: 2
    error: 1
  excluded: [id, ok, up, to, at, no, on, e, w]

type_name:
  min_length: 3
  max_length: 50

reporter: xcode
